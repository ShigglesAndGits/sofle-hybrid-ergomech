# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
# nice_nano//zmk resolves to board revision 2.0.0 (nice!nano v2) by default;
# see app/module/boards/nicekeyboards/nice_nano/board.yml in ZMK.
include:
  - board: nice_nano//zmk
    shield: sofle_ergomech_left nice_view_adapter nice_view_gem
  - board: nice_nano//zmk
    shield: sofle_ergomech_right
  - board: nice_nano//zmk
    shield: settings_reset
