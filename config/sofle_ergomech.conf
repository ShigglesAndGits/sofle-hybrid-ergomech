# Settings shared by both halves. Role-specific configs (central-only,
# peripheral-only) live in boards/shields/sofle_ergomech/sofle_ergomech_{left,right}.conf
# to keep Zephyr 4.1 Kconfig strict-mode happy.

# Display config lives in sofle_ergomech_left.conf (nice!view on left only).
# Keep ZMK_DISPLAY out of this shared file: an explicit =y here overrides the
# right shield's Kconfig.defconfig "default n" and drags LVGL onto the
# peripheral, which has no screen.

# Encoders (both halves)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# I2C bus (right half: Cirque trackpad)
CONFIG_I2C=y
CONFIG_ZMK_POINTING=y

# Power management: 24h idle timeout, deep sleep disabled (CONFIG_ZMK_SLEEP unset).
# Powered by 18650s / nearly always plugged in — prioritize responsiveness over battery.
CONFIG_ZMK_IDLE_TIMEOUT=86400000

# Bluetooth signal strength optimization
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Keep the radio on 1M PHY. Despite the name, this flag's only effect at the
# pinned ZMK revision is BT_CTLR_PHY_2M=n; 2M PHY is the known dropout trigger
# with Windows Realtek/Intel adapters, especially with a second host connected.
# Setting this to n (June 2026) silently re-enabled 2M PHY.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Heavier pointing and fast typing traffic over BLE benefits from more queue/stack headroom.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=40
CONFIG_ZMK_BLE_CONSUMER_REPORT_QUEUE_SIZE=10
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=64
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=16
CONFIG_INPUT_THREAD_STACK_SIZE=3072

# Enlarge the shared outgoing-ACL buffer pool. Zephyr 4.1 defaults to 3 TX
# buffers shared across ALL links (both hosts + the split link). A host whose
# controller drops uncleanly pins its queued buffers until supervision timeout
# expires; a flapping host controller can pin the whole pool indefinitely,
# which starves the split link and wedges both halves until a power-cycle.
# More headroom lets the split link keep transmitting through a host flap.
# BT_BUF_EVT_RX_COUNT must exceed BT_BUF_ACL_TX_COUNT (Zephyr 4.1 static
# assert) — that coupling is why the earlier =10/=10 overrides were dropped.
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=16

# Allow more time for connection parameter negotiation at startup
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=5000

# Use stable static address instead of Resolvable Private Address.
# Windows/Realtek BT stacks lose IRK-based identity resolution after RPA
# rotation, treating the post-rotation address as a new device and
# dropping the bond. Static addressing sidesteps the whole problem.
CONFIG_BT_PRIVACY=n

# Allow legacy LE pairing as a fallback alongside Secure Connections.
# Zephyr 4.1 leans SC-only; Realtek chips have buggy SC implementations
# that fail the ceremony. Legacy pairing's reduced security is moot
# for a personal peripheral with a known threat model.
CONFIG_BT_SMP_SC_PAIR_ONLY=n

# Uncomment this line below to add rgb underglow / backlight support
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
