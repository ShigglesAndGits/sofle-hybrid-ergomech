# Left half: central role, has the OLED display.

# Enable nice!view display using nice-view-gem custom screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Smooth scrolling is processed centrally (where pointing events resolve)
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Central-side split BLE tunables
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=40
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=20
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=2048

# USB CDC-ACM logging (paired with the zmk-usb-logging snippet in build.yaml).
# Temporary, for keymap heatmap/chord data collection: every position event
# (both halves) is emitted to the serial console. Big buffer + fast flush so
# bursty typing doesn't drop log lines. ZMK_LOG_LEVEL defaults to 4 (debug),
# which is what emits zmk_keymap_apply_position_state / position_state_down.
# Remove with the snippet when collection is done — logging costs CPU/battery.
CONFIG_LOG_BUFFER_SIZE=31768
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_SPEED=y
