# Right half: peripheral role. Has the Cirque trackpad.
# Peripheral does not speak USB HID directly, so disable ZMK_USB to
# silence the unmet-dependency warning under Zephyr 4.1 strict mode.
CONFIG_ZMK_USB=n

# Cirque Pinnacle trackpad (upstream Zephyr 4.1 driver)
CONFIG_INPUT_PINNACLE=y

# NOTE: do not add CONFIG_BT_PERIPHERAL_PREF_* here. This half's only BLE
# link is to the left half, whose central dictates the split connection
# parameters (CONFIG_ZMK_SPLIT_BLE_PREF_INT/LATENCY/TIMEOUT, set on the
# LEFT build); ZMK also sets BT_GAP_AUTO_UPDATE_CONN_PARAMS=n on
# peripherals, so PREF_* values here are never requested and only populate
# an unread GATT characteristic. A PREF_* block removed 2026-07 was inert.

# Larger peripheral buffers for bursty traffic
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=3072
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_PRIORITY=5
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=40
